<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Slate Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glowing Mint Accent Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7FCB0"/>
      <stop offset="100%" stop-color="#8CFA96"/>
    </linearGradient>

{/* Outer Glow Filter for the Mint Square Dot */}
    <filter id="mintDotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base / Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Mint Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#8CFA96" stroke-opacity="1" stroke-width="6"/>

  <!-- Antennas -->
  <path d="M196 166 L156 106" stroke="url(#mintGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M316 166 L356 106" stroke="url(#mintGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- TV Outer Frame Screen -->
  <rect x="116" y="166" width="280" height="210" rx="36" fill="#090D16" stroke="#8CFA96" stroke-width="8"/>

  {/* Glowing Mint Square Status Dot (MINT.LOGIC Style) */}
  <rect 
    x="348" 
    y="188" 
    width="20" 
    height="20" 
    rx="3" 
    fill="#8CFA96" 
    filter="url(#mintDotGlow)"
  />

  {/* Center Play Button */}
  <path 
    d="M236 226 L308 266 L236 306 Z" 
    fill="#FFFFFF" 
  />
</svg>
